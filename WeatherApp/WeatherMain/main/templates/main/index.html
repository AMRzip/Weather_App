<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-text: #ffffff;
            --secondary-text: #b3b3b3;
            --accent: #00a8ff;
            --input-bg: #2d2d2d;
            --card-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--primary-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        
        h1 {
            margin-bottom: 2rem;
            font-weight: 300;
            font-size: 2.5rem;
            color: var(--accent);
            text-align: center;
        }
        
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 3rem;
        }
        
        input {
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            border: none;
            background-color: var(--input-bg);
            color: var(--primary-text);
            font-size: 1rem;
            flex: 1;
            min-width: 200px;
            outline: none;
            transition: box-shadow 0.3s ease;
        }
        
        input:focus {
            box-shadow: 0 0 0 2px var(--accent);
        }
        
        button {
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            border: none;
            background-color: var(--accent);
            color: #ffffff;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            background-color: #0096e3;
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .comparison-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            width: 100%;
        }
        
        .city-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            box-shadow: var(--card-shadow);
        }

        @media (max-width: 768px) {
            form {
                flex-direction: column;
                align-items: center;
            }
            
            input {
                width: 100%;
            }
            
            .city-container {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Weather Comparison</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="city1" placeholder="Enter first city...">
        <input type="text" name="city2" placeholder="Enter second city...">
        <button type="submit">Compare</button>
    </form>
    <div class="comparison-container">
        {% if weather_data1 %}
            <div class="city-container">
                {% include 'main/city.html' with weather_data=weather_data1 daily_forecasts=daily_forecast1 %}
            </div>
        {% endif %}
        {% if weather_data2 %}
            <div class="city-container">
                {% include 'main/city.html' with weather_data=weather_data2 daily_forecasts=daily_forecast2 %}
            </div>
        {% endif %}
    </div>
</body>
</html>
